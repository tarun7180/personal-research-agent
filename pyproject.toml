[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-research-agent"
version = "0.1.0"
description = "CLI research agent that writes cited reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "httpx",
  "trafilatura",
  "pypdf",
  "pydantic>=2",
  "typer",
  "rich",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pra = "pra.cli:app"

[tool.setuptools.packages.find]
include = ["pra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
